      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    assignees:
      - markheydon
    labels:
      - dependencies
    groups:
      docker-compose:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
